<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARQUIVO Ø | Estatísticas</title><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><div class="top"><div><p class="eyebrow">ARQUIVO Ø · ADMIN</p><h1>ESTATÍSTICAS</h1></div><a class="btn" href="index.html">PAINEL ADMINISTRATIVO</a></div><div class="red-line"></div><section class="panel"><p class="muted">TOTAL DE ACESSOS</p><div id="total" class="stat-number">------</div><p id="status" class="status"></p></section><section class="panel"><h2>PAÍSES</h2><div id="paises"></div></section><section class="panel"><h2>REGIÕES</h2><div id="regioes"></div></section></main><script>async function carregar(){const s=document.getElementById('status');try{const r=await fetch('/api/estatisticas',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erro');document.getElementById('total').textContent=d.total;document.getElementById('paises').innerHTML=(d.paises||[]).map(x=>`<p>${esc(x.codigo)} <strong>${x.acessos}</strong></p>`).join('')||'<p class="muted">Sem dados.</p>';let h='';for(const [pais,lista] of Object.entries(d.regioes||{})){h+=`<h3>${esc(pais)}</h3>`+(lista.map(x=>`<p>${esc(x.nome)} <strong>${x.acessos}</strong></p>`).join(''));}document.getElementById('regioes').innerHTML=h||'<p class="muted">Sem dados.</p>';s.textContent=d.atualizadoEm?`Atualizado em ${new Date(d.atualizadoEm).toLocaleString('pt-BR')}`:'';}catch(e){s.className='status err';s.textContent=e.message}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}carregar();</script></body></html>
