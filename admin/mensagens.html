<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ARQUIVO Ø | Mensagens</title>
    <link rel="stylesheet" href="admin.css">

    <link rel="icon" type="image/png" href="../assets/favicon2.png">
</head>

<body>
    <main class="wrap">
        <div class="top">
            <div>
                <p class="eyebrow">ARQUIVO Ø · ADMIN</p>
                <h1>MENSAGENS</h1>
            </div><a class="btn" href="index.html">PAINEL ADMINISTRATIVO</a>
        </div>
        
        <div class="red-line"></div>

        <section id="authGate" class="panel auth">
            <h2>ACESSO ADMINISTRATIVO</h2>
            <p class="muted">Informe o token administrativo configurado no Cloudflare.</p>
            <form id="authForm">
                <div class="field"><label>TOKEN</label><input id="adminToken" type="password"
                        autocomplete="current-password" required></div><button class="btn primary">ENTRAR</button>
            </form>
        </section>
        <section id="adminApp" class="hidden">
            <div class="actions"><button id="logoutBtn" class="btn">SAIR</button><button id="reloadBtn"
                    class="btn">ATUALIZAR</button></div>
            <p id="status" class="status"></p>
            <div id="lista"></div>
        </section>
    </main>
    <script src="admin.js"></script>
    <script src="status_mensagens.js"></script>
</body>

</html>
