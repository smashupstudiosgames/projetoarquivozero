<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ARQUIVO Ø | Mantenedores</title>
    <link rel="stylesheet" href="admin.css">

    <link rel="icon" type="image/png" href="../assets/favicon2.png">
</head>

<body>
    <main class="wrap">
        <div class="top">
            <div>
                <p class="eyebrow">ARQUIVO Ø · ADMIN</p>
                <h1>MANTENEDORES</h1>
            </div><a class="btn" href="index.html">PAINEL ADMINISTRATIVO</a>
        </div>
        <div class="red-line"></div>
        <section id="authGate" class="panel auth">
            <h2>ACESSO ADMINISTRATIVO</h2>
            <p class="muted">Informe o token administrativo configurado no Cloudflare.</p>
            <form id="authForm">
                <div class="field"><label>TOKEN</label><input id="adminToken" type="password" required></div><button
                    class="btn primary">ENTRAR</button>
            </form>
        </section>
        <section id="adminApp" class="hidden">
            <div class="actions"><button id="logoutBtn" class="btn">SAIR</button></div>
            <section class="panel">
                <h2 id="formTitle">NOVO MANTENEDOR</h2>
                <form id="form"><input id="id" type="hidden">
                    <div class="field"><label>IMAGEM / LOGO</label><input id="imagem" type="file"
                            accept="image/png,image/jpeg,image/webp,image/svg+xml">
                        <p class="small muted">PNG, JPG, WEBP ou SVG. Máximo recomendado: 1,5 MB.</p><img id="preview"
                            class="logo-preview hidden" alt="Prévia da marca">
                    </div>
                    <div class="row">
                        <div class="field"><label>NOME</label><input id="nome" maxlength="120" required></div>
                        <div class="field"><label>VALOR</label><input id="valor" type="number" min="0" step="0.01"
                                required></div>
                    </div>
                    <div class="row">
                        <div class="field"><label>CATEGORIA</label><select id="categoria" required>
                                <option value="platinum">PLATINUM</option>
                                <option value="gold">GOLD</option>
                                <option value="silver">SILVER</option>
                            </select></div>
                        <div class="field"><label>STATUS</label><label class="check"><input id="active" type="checkbox"
                                    checked> ATIVO</label></div>
                    </div>
                    <div class="field"><label>MENSAGEM</label><textarea id="mensagem" maxlength="1000"
                            placeholder="Mensagem institucional, agradecimento ou informação para uso futuro."></textarea>
                    </div>
                    <div class="actions"><button class="btn primary" type="submit">SALVAR</button><button id="cancelar"
                            class="btn" type="button">LIMPAR</button></div>
                    <p id="formStatus" class="status"></p>
                </form>
            </section>
            <section class="panel">
                <h2>CADASTRADOS</h2>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>MARCA</th>
                                <th>NOME</th>
                                <th>CATEGORIA</th>
                                <th>VALOR</th>
                                <th>ATIVO</th>
                                <th>AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>
    <script src="admin.js"></script>
    <script>
        let imagemAtual = ''; function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
        function resetForm() { document.getElementById('form').reset(); document.getElementById('id').value = ''; document.getElementById('active').checked = true; imagemAtual = ''; document.getElementById('preview').classList.add('hidden'); document.getElementById('formTitle').textContent = 'NOVO MANTENEDOR'; document.getElementById('formStatus').textContent = '' }
        document.getElementById('imagem').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; if (f.size > 1.5 * 1024 * 1024) { alert('A imagem ultrapassa 1,5 MB. Reduza o arquivo antes de enviar.'); e.target.value = ''; return } const r = new FileReader(); r.onload = () => { imagemAtual = r.result; const p = document.getElementById('preview'); p.src = imagemAtual; p.classList.remove('hidden') }; r.readAsDataURL(f) });
        async function carregar() { try { const d = await Admin.api('/api/admin/mantenedores'); const itens = d.mantenedores || []; document.getElementById('tbody').innerHTML = itens.map(x => `<tr><td>${x.image ? `<img class="logo-preview" src="${esc(x.image)}" alt="">` : '-'}</td><td>${esc(x.name)}</td><td>${esc(x.category).toUpperCase()}</td><td>${Number(x.amount).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td><td>${x.active ? 'SIM' : 'NÃO'}</td><td><div class="actions"><button class="btn" onclick='editar(${JSON.stringify(x).replace(/'/g, "&#39;")})'>EDITAR</button><button class="btn danger" onclick="remover('${esc(x.id)}')">EXCLUIR</button></div></td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nenhum mantenedor cadastrado.</td></tr>'; } catch (e) { document.getElementById('formStatus').className = 'status err'; document.getElementById('formStatus').textContent = e.message } }
        function editar(x) { document.getElementById('id').value = x.id; document.getElementById('nome').value = x.name || ''; document.getElementById('valor').value = x.amount ?? 0; document.getElementById('categoria').value = x.category || 'silver'; document.getElementById('active').checked = x.active !== false; document.getElementById('mensagem').value = x.message || ''; imagemAtual = x.image || ''; const p = document.getElementById('preview'); if (imagemAtual) { p.src = imagemAtual; p.classList.remove('hidden') } else p.classList.add('hidden'); document.getElementById('formTitle').textContent = 'EDITAR MANTENEDOR'; scrollTo({ top: 0, behavior: 'smooth' }) }
        document.getElementById('form').addEventListener('submit', async e => { e.preventDefault(); const id = document.getElementById('id').value; const body = { id: id || undefined, name: document.getElementById('nome').value.trim(), message: document.getElementById('mensagem').value.trim(), amount: Number(document.getElementById('valor').value), category: document.getElementById('categoria').value, active: document.getElementById('active').checked, image: imagemAtual }; if (!body.image) { document.getElementById('formStatus').textContent = 'Selecione uma imagem/logo.'; return } try { await Admin.api('/api/admin/mantenedores', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) }); resetForm(); await carregar() } catch (err) { document.getElementById('formStatus').className = 'status err'; document.getElementById('formStatus').textContent = err.message } });
        async function remover(id) { if (!confirm('Excluir este mantenedor definitivamente?')) return; try { await Admin.api('/api/admin/mantenedores', { method: 'DELETE', body: JSON.stringify({ id }) }); resetForm(); carregar() } catch (e) { alert(e.message) } } document.getElementById('cancelar').addEventListener('click', resetForm); Admin.setupAuth(carregar);
    </script>
</body>

</html>
